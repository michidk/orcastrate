name: Publish main image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-main-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: ghcr.io/michidk/orcastrate:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Action entrypoint
        run: |
          docker run --rm --entrypoint /usr/local/bin/action-entrypoint.sh \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            ghcr.io/michidk/orcastrate:main orchestrator.toml validate pr false
          docker run --rm --entrypoint /usr/local/bin/action-entrypoint.sh \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            ghcr.io/michidk/orcastrate:main orchestrator.toml validate pr true

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        run: docker push ghcr.io/michidk/orcastrate:main
